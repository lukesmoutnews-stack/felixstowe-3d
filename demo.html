<title>Felixstowe 3D Demo</title>
<link rel="stylesheet" href="src/style.css">
<style>
  .demo-switch { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: #b9c2ca; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .demo-switch a { color: var(--cream); padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; }
  .demo-switch a[aria-current="true"] { background: var(--cream); color: var(--ink); }
  .demo-note { width: 100%; color: #8796a3; }
</style>
<script>
  // Demo data sets. Default: real Felixstowe (OSM 8 Oct 2026, Overture, EA LiDAR 2020/2023), prepared
  // by the GitHub Actions workflow and converted with tools/make-web-data.mjs.
  window.F3D_DEMO = location.hash === '#vaduz' ? { data: 'test/real-osm-liechtenstein/' }
    : location.hash === '#test' ? { fixture: 'test-grid', terrain: 'test/lidar/out-web/terrain.json' }
    : { data: 'fx/' };
  addEventListener('hashchange', () => location.reload());
</script>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<canvas id="scene"></canvas>
<div id="ui"></div>
<script type="module" src="src/main.js"></script>
<script>
  const mode = location.hash === '#vaduz' ? 'vaduz' : location.hash === '#test' ? 'test' : 'fx';
  const add = setInterval(() => {
    const card = document.querySelector('.load-card'); if (!card) return; clearInterval(add);
    const d = document.createElement('div'); d.className = 'demo-switch';
    d.innerHTML = `<span>Demo data:</span>
      <a href="#felixstowe" aria-current="${mode === 'fx'}">Felixstowe (real data)</a>
      <a href="#test" aria-current="${mode === 'test'}">Test town</a>
      <a href="#vaduz" aria-current="${mode === 'vaduz'}">Vaduz 2013</a>
      <span class="demo-note">Felixstowe: OpenStreetMap (8 Oct 2026), Overture buildings and Environment Agency LiDAR. Roof shapes, facades and container colours are generated, not surveyed.</span>`;
    card.append(d);
  }, 100);
</script>
